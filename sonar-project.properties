# SonarCloud / SonarQube configuration for Meobanh22/ricing
# Note: Adjust sonar.organization and sonar.projectKey to match your SonarCloud import settings.
sonar.projectKey=Meobanh22_ricing
sonar.organization=meobanh22
sonar.projectName=ricing

sonar.sources=config,scripts,install,plymouth
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Exclude generated assets, dev tools, Firefox prefs JS, and GTK/Firefox CSS dialects
# (@define-color, alpha(), @-moz-document, XUL selectors) that web CSS linters misflag.
sonar.exclusions=\
  assets/**,\
  dev_tools/**,\
  **/__pycache__/**,\
  **/*.svg,\
  config/firefox/user.js,\
  config/firefox/chrome/**/*.css,\
  config/gtk-3.0/**/*.css,\
  config/gtk-4.0/**/*.css,\
  config/hypr/styles/**/*.css,\
  config/waybar/**/*.css,\
  config/swaync/**/*.css,\
  config/wlogout/**/*.css
