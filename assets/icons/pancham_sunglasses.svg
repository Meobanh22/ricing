  <!-- Left Lens Glare Lines (White Anime Reflection) -->
  <path d="M 21 44 L 16 56" stroke="#FFF0F5" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <path d="M 27 44 L 21 59" stroke="#FFF0F5" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>

  <!-- Right Lens Glare Lines -->
  <path d="M 63 44 L 58 56" stroke="#FFF0F5" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <path d="M 69 44 L 63 59" stroke="#FFF0F5" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>

  <!-- Top Frame Highlight Accent -->
  <path d="M 15 36 C 25 35, 38 35, 44 38" stroke="#F02D4C" stroke-width="2.0" stroke-linecap="round" fill="none"/>
  <path d="M 85 36 C 75 35, 62 35, 56 38" stroke="#F02D4C" stroke-width="2.0" stroke-linecap="round" fill="none"/>
</svg>