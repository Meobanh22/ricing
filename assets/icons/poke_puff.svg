<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Warm Biscuit Liner Gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97746"/>
      <stop offset="50%" stop-color="#F3A277"/>
      <stop offset="100%" stop-color="#C86230"/>
    </linearGradient>
    <!-- Golden Sponge Cake -->
    <linearGradient id="spongeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Soft Strawberry Whipped Cream -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="40%" stop-color="#FFA8BF"/>
      <stop offset="100%" stop-color="#FF6B8B"/>
    </linearGradient>
    <!-- Cheri Berry Topping -->
    <radialGradient id="berryGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF597B"/>
      <stop offset="65%" stop-color="#EE1C42"/>
      <stop offset="100%" stop-color="#9E0A28"/>
    </radialGradient>
    <filter id="puffGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2B1017" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#puffGlow)">
    <!-- 1. Cupcake Liner Base -->
    <path d="M 72 164 L 84 224 C 84 228, 88 232, 94 232 L 162 232 C 168 232, 172 228, 172 224 L 184 164 Z" 
          fill="url(#cupGrad)" stroke="#8C3814" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 3 Simple Clean Pleats -->
    <line x1="100" y1="165" x2="106" y2="231" stroke="#8C3814" stroke-width="2" opacity="0.55"/>
    <line x1="128" y1="166" x2="128" y2="232" stroke="#8C3814" stroke-width="2" opacity="0.55"/>
    <line x1="156" y1="165" x2="150" y2="231" stroke="#8C3814" stroke-width="2" opacity="0.55"/>

    <!-- 2. Baked Sponge Golden Rim -->
    <path d="M 66 166 C 58 154, 70 144, 96 145 C 114 146, 142 146, 160 145 C 186 144, 198 154, 190 166 C 182 173, 162 173, 128 173 C 94 173, 74 173, 66 166 Z" 
          fill="url(#spongeGrad)" stroke="#B45309" stroke-width="2"/>

    <!-- 3. Fluffy Cream Cloud (Tier 1 Base) -->
    <path d="M 64 150 
             C 50 134, 72 114, 94 122 
             C 106 104, 150 104, 162 122 
             C 184 114, 206 134, 192 150 
             C 176 160, 146 156, 128 156 
             C 110 156, 80 160, 64 150 Z" 
          fill="url(#creamGrad)" stroke="#9F1239" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 4. Swirled Frosting Dollop (Tier 2 Apex) -->
    <path d="M 88 126 
             C 84 104, 102 82, 122 72 
             C 134 66, 144 68, 145 76 
             C 146 84, 136 90, 130 88 
             C 144 94, 154 102, 148 116 
             C 140 126, 108 132, 88 126 Z" 
          fill="url(#creamGrad)" stroke="#881337" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Cream Highlights -->
    <path d="M 76 136 C 88 126, 110 126, 122 132" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 104 104 C 114 94, 130 94, 140 102" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- 5. Single Cheri Berry Topping -->
    <!-- Green Leaf -->
    <path d="M 132 58 C 142 50, 152 54, 148 62 C 142 64, 136 62, 132 58 Z" fill="#4ADE80" stroke="#166534" stroke-width="1.5"/>
    <!-- Berry -->
    <circle cx="128" cy="64" r="15" fill="url(#berryGrad)" stroke="#70051B" stroke-width="2"/>
    <!-- Berry Highlight Dot -->
    <circle cx="123" cy="59" r="3.5" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>