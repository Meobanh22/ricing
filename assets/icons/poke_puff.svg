<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Cupcake Liner Gradients -->
    <linearGradient id="linerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C26A3D"/>
      <stop offset="30%" stop-color="#E89565"/>
      <stop offset="70%" stop-color="#F5B288"/>
      <stop offset="100%" stop-color="#B55D30"/>
    </linearGradient>
    <!-- Fluffy Golden Sponge Cake -->
    <radialGradient id="spongeGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <!-- Strawberry Whipped Cream Swirl -->
    <linearGradient id="creamGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="40%" stop-color="#FFB3C6"/>
      <stop offset="100%" stop-color="#FF7597"/>
    </linearGradient>
    <linearGradient id="creamGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFA3BA"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <!-- Cheri Berry Topping -->
    <radialGradient id="berryGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF6384"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#880521"/>
    </radialGradient>
    <filter id="puffShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2D1117" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#puffShadow)">
    <!-- 1. Ribbed Baking Liner (Cupcake wrapper) -->
    <path d="M 64 162 L 78 226 C 78 230, 84 234, 90 234 L 166 234 C 172 234, 178 230, 178 226 L 192 162 Z" 
          fill="url(#linerGrad)" stroke="#8C3F18" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Liner Pleat Ridges -->
    <line x1="84" y1="164" x2="94" y2="232" stroke="#8C3F18" stroke-width="2" opacity="0.6"/>
    <line x1="104" y1="165" x2="112" y2="233" stroke="#8C3F18" stroke-width="2" opacity="0.6"/>
    <line x1="128" y1="166" x2="128" y2="234" stroke="#8C3F18" stroke-width="2" opacity="0.6"/>
    <line x1="152" y1="165" x2="144" y2="233" stroke="#8C3F18" stroke-width="2" opacity="0.6"/>
    <line x1="172" y1="164" x2="162" y2="232" stroke="#8C3F18" stroke-width="2" opacity="0.6"/>

    <!-- 2. Golden Sponge Base Puff -->
    <path d="M 58 164 
             C 48 152, 60 140, 78 140 
             C 92 140, 110 144, 128 144 
             C 146 144, 164 140, 178 140 
             C 196 140, 208 152, 198 164 
             C 188 172, 170 172, 128 172 
             C 86 172, 68 172, 58 164 Z" 
          fill="url(#spongeGrad)" stroke="#B45309" stroke-width="2"/>

    <!-- 3. Bottom Whipped Cream Tier -->
    <path d="M 62 148 
             C 52 134, 70 118, 92 124 
             C 106 108, 142 108, 164 124 
             C 186 118, 204 134, 194 148 
             C 178 158, 148 152, 128 152 
             C 108 152, 78 158, 62 148 Z" 
          fill="url(#creamGrad1)" stroke="#BE123C" stroke-width="2"/>

    <!-- 4. Mid Swirl Cream Tier -->
    <path d="M 80 126 
             C 74 110, 92 92, 114 96 
             C 124 84, 148 84, 160 98 
             C 176 102, 184 118, 172 130 
             C 152 136, 102 136, 80 126 Z" 
          fill="url(#creamGrad2)" stroke="#9F1239" stroke-width="2"/>

    <!-- 5. Top Frosting Dollop & Curled Swirl Apex -->
    <path d="M 104 98 
             C 102 82, 112 68, 124 64 
             C 134 60, 146 62, 148 70 
             C 150 78, 138 84, 132 82 
             C 142 88, 152 94, 146 104 
             C 136 108, 114 108, 104 98 Z" 
          fill="url(#creamGrad1)" stroke="#881337" stroke-width="1.8"/>

    <!-- Frosting Highlights (Creamy shine) -->
    <path d="M 72 136 C 82 126, 102 126, 114 132" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <path d="M 144 132 C 158 126, 176 126, 184 136" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <path d="M 98 108 C 110 98, 130 98, 144 106" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- 6. Kalos Cheri Berry Garnish on Top -->
    <!-- Green Mint Leaves -->
    <path d="M 132 64 C 124 54, 126 44, 136 46 C 138 52, 136 60, 132 64 Z" fill="#4ADE80" stroke="#166534" stroke-width="1.5"/>
    <path d="M 134 62 C 144 54, 154 58, 150 66 C 144 68, 138 66, 134 62 Z" fill="#22C55E" stroke="#166534" stroke-width="1.5"/>
    <!-- Heart Berry Body -->
    <path d="M 132 62 
             C 124 58, 114 66, 118 78 
             C 122 88, 132 94, 134 96 
             C 136 94, 146 88, 150 78 
             C 154 66, 144 58, 136 62 Z" 
          fill="url(#berryGrad)" stroke="#70051B" stroke-width="1.8"/>
    <circle cx="127" cy="70" r="2.5" fill="#FFFFFF" opacity="0.75"/>

    <!-- 7. Whimsical Sugar Sprinkles / Stars -->
    <!-- Yellow Star Sprinkle -->
    <polygon points="98,142 100,146 104,147 101,150 102,154 98,152 94,154 95,150 92,147 96,146" fill="#FBBF24"/>
    <!-- Blue Ribbon Sugar Pearl -->
    <circle cx="158" cy="146" r="3.2" fill="#50A6FF" stroke="#1D4ED8" stroke-width="1"/>
    <!-- Violet Sugar Pearl -->
    <circle cx="128" cy="120" r="3" fill="#C084FC" stroke="#6B21A8" stroke-width="1"/>
  </g>
</svg>
