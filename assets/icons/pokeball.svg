<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Top Scarlet Red Gradient -->
    <radialGradient id="topBallGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FF476B"/>
      <stop offset="55%" stop-color="#EE1C42"/>
      <stop offset="100%" stop-color="#B30524"/>
    </radialGradient>
    <!-- Bottom Pearl Ceramic White Gradient -->
    <radialGradient id="botBallGrad" cx="38%" cy="75%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </radialGradient>
    <!-- Center Button Gradient -->
    <radialGradient id="btnGrad" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#140206" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#ballShadow)">
    <!-- Base Outer Shell -->
    <circle cx="128" cy="128" r="102" fill="#1C1E24" stroke="#0F1115" stroke-width="3"/>

    <!-- Bottom Hemisphere (White) -->
    <path d="M 26 128 A 102 102 0 0 0 230 128 L 166 128 A 38 38 0 0 1 90 128 Z" fill="url(#botBallGrad)"/>

    <!-- Top Hemisphere (Red) -->
    <path d="M 26 128 A 102 102 0 0 1 230 128 L 166 128 A 38 38 0 0 0 90 128 Z" fill="url(#topBallGrad)"/>

    <!-- Top Specular Anime Gloss Arc -->
    <path d="M 52 88 A 90 90 0 0 1 128 38" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    <path d="M 148 41 A 90 90 0 0 1 180 54" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.4"/>

    <!-- Equatorial Black Seam Band -->
    <path d="M 26 128 L 90 128" stroke="#1C1E24" stroke-width="12" stroke-linecap="round"/>
    <path d="M 166 128 L 230 128" stroke="#1C1E24" stroke-width="12" stroke-linecap="round"/>

    <!-- Center Button Bezel Ring -->
    <circle cx="128" cy="128" r="38" fill="#1C1E24" stroke="#0F1115" stroke-width="3"/>

    <!-- Center Release Button Core -->
    <circle cx="128" cy="128" r="23" fill="url(#btnGrad)" stroke="#64748B" stroke-width="2"/>
    <circle cx="128" cy="128" r="14" fill="none" stroke="#CBD5E1" stroke-width="1.8"/>
    <!-- Subtle Button Specular Dot -->
    <circle cx="123" cy="122" r="3.5" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
