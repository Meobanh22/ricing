<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Serena's Raspberry Fedora with Black Ribbon Band & Rolled Brim -->
  <g stroke="#4D0A1C" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- Hat Crown: Creased Top Fedora (Left crest, center crease dip, right crest) -->
    <path d="M 23 54 C 20 40, 24 28, 32 23 C 38 19, 44 23, 50 21 C 56 19, 64 21, 68 26 C 76 32, 79 42, 77 54 Z"
          fill="#DC1A36"/>

    <!-- Crown Cel Highlight (Top crease shine) -->
    <path d="M 28 35 C 26 27, 32 24, 42 22 C 36 24, 30 30, 30 38 Z"
          fill="#F02D4C" stroke="none"/>

    <!-- Wide Black Ribbon Hatband (Wrapped around crown base) -->
    <path d="M 22 54 C 32 50, 68 50, 78 54 L 79 63 C 68 59, 32 59, 21 63 Z"
          fill="#201011"/>

    <!-- Black Ribbon Bow Knot on Left Side -->
    <ellipse cx="23" cy="59" rx="4.5" ry="6" fill="#2A1A1E" stroke="#4D0A1C" stroke-width="2.2"/>
    <path d="M 21 63 C 18 68, 15 72, 13 74 L 17 74 C 19 71, 22 67, 23 63 Z"
          fill="#201011" stroke="#4D0A1C" stroke-width="1.8"/>

    <!-- Rolled Felt Brim (Curled doughnut lip all around) -->
    <path d="M 9 66 C 18 58, 40 56, 50 56 C 60 56, 82 58, 91 66 C 96 70, 93 78, 86 80 C 70 84, 30 84, 14 80 C 7 78, 4 70, 9 66 Z"
          fill="#DC1A36"/>

    <!-- Rolled Rim Highlight / Inner Lip -->
    <path d="M 14 74 C 28 78, 72 78, 86 74"
          stroke="#F02D4C" stroke-width="2.2" fill="none"/>
  </g>
</svg>