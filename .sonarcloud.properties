# SonarQube Cloud (Automatic Analysis) configuration for Meobanh22/ricing
sonar.sources=config,scripts,install,plymouth
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Exclude generated assets, dev tools, SVGs, Firefox prefs JS, and GTK/Firefox CSS dialects
sonar.exclusions=\
  assets/**,\
  dev_tools/**,\
  **/__pycache__/**,\
  **/*.svg,\
  config/firefox/user.js,\
  config/firefox/chrome/**/*.css,\
  config/gtk-3.0/**/*.css,\
  config/gtk-4.0/**/*.css,\
  config/hypr/styles/**/*.css,\
  config/waybar/**/*.css,\
  config/swaync/**/*.css,\
  config/wlogout/**/*.css
