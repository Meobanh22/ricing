# ==============================================================================
# 🌹 SERENA & SYLVEON HYPRLAND CONFIGURATION
# ==============================================================================
# Tông màu: Serena Crimson (#E53935), Ribbon Rose (#FF6B8B), Midnight Charcoal (#181825)
# Card đồ họa: Intel Iris Xe Graphics (Tối ưu Wayland native, không cần fix Nvidia)
# ==============================================================================

# --- MÀN HÌNH (MONITOR) - Scale 1.2 (120%) chuẩn tỷ lệ pixel 1600x900 sắc nét ---
monitor=,preferred,auto,1.2

# --- BIẾN MÔI TRƯỜNG (ENVIRONMENT) ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb

# Bộ gõ Tiếng Việt (Fcitx5 Native Wayland chuẩn mượt nhất)
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = GLFW_IM_MODULE,fcitx
env = BROWSER,microsoft-edge-stable

# Con trỏ chuột Sylveon Custom (Đa nền tảng: Hyprcursor native & Xcursor)
env = HYPRCURSOR_THEME,sylveon-custom
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,sylveon-custom
env = XCURSOR_SIZE,24

# --- KHỞI ĐỘNG CÙNG HỆ THỐNG (AUTOSTART) ---
# 1. Quản lý hình nền siêu mượt
exec-once = swww-daemon &
exec-once = sleep 0.8 && python3 ~/.config/hypr/scripts/wallpaper_switcher.py current

# 2. Thanh Bar & Tiện ích (Waybar)
exec-once = waybar

# 3. Con trỏ chuột Sylveon Custom
exec-once = hyprctl setcursor sylveon-custom 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme "sylveon-custom"

# 4. Polkit xác thực quyền (Root/Admin popup)
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1

# 5. Kích hoạt bộ gõ Tiếng Việt Fcitx5 (hoặc IBus fallback)
exec-once = (fcitx5 -d --replace || ~/.config/hypr/scripts/init_ime.sh)

# 6. Trung tâm thông báo (SwayNC)
exec-once = swaync &

# 7. Khởi động Dịch vụ lưu trữ mật khẩu & mã hóa (GNOME Keyring cho VS Code / Chrome)
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GNOME_KEYRING_CONTROL SSH_AUTH_SOCK

# --- BÀN PHÍM & TOUCHPAD (INPUT) ---
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 0.8
    }
    sensitivity = 0 # -1.0 -> 1.0, 0 là mặc định
}

cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
    sync_gsettings_theme = true
}

# --- BỐ CỤC & TÔNG MÀU (GENERAL) ---
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2

    # Viền Đỏ Serena chuyển sắc Hồng Ribbon sang trọng
    col.active_border = rgb(E53935) rgb(FF6B8B) 45deg
    # Viền cửa sổ không kích hoạt (Tím than trầm mờ)
    col.inactive_border = rgba(24182588)

    layout = dwindle
    allow_tearing = false
}

# --- HIỆU ỨNG THẨM MỸ (DECORATION) ---
decoration {
    rounding = 14

    # Độ trong suốt cửa sổ
    active_opacity = 0.94
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0

    # Hiệu ứng Kính Mờ (Glassmorphism Blur)
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    # Đổ bóng (Shadow)
    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(00000055)
        color_inactive = rgba(00000033)
    }
}

# --- HOẠT ẢNH MƯỢT MÀ (ANIMATIONS) ---
animations {
    enabled = true

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = bounce, 0.34, 1.56, 0.64, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07

    animation = windows, 1, 4, wind, slide
    animation = windowsIn, 1, 4, winIn, popin 75%
    animation = windowsOut, 1, 4, winOut, popin 75%
    animation = border, 1, 8, default
    animation = borderangle, 1, 30, default, loop
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, wind, slide
    animation = layersIn, 1, 2, default, fade
    animation = layersOut, 1, 2, default, fade
}

# --- QUY TẮC CỬA SỔ (WINDOW RULES) ---
windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^(pavucontrol|nm-connection-editor|blueman-manager)$, float on
windowrule = match:class ^(btop-serena)$, float on
windowrule = match:class ^(btop-serena)$, size 960 620
windowrule = match:class ^(btop-serena)$, center on
windowrule = match:class ^(serena-dashboard)$, float on
windowrule = match:class ^(serena-dashboard)$, animation slide top
windowrule = match:class ^(serena-control-center)$, float on
windowrule = match:class ^(serena-control-center)$, animation slide top
windowrule = match:title ^(Open File|Save File|Confirm).*, float on

# --- QUY TẮC LỚP (LAYER RULES) ---
# rofi menu ứng dụng
layerrule = match:namespace rofi, blur on
layerrule = match:namespace serena-control-center, blur on
layerrule = match:namespace serena-control-center, animation slide top

# --- PHÍM TẮT ĐIỀU KHIỂN (TỐI ƯU: 1 CHỨC NĂNG = 1 PHÍM TẮT CHUẨN) ---
$mainMod = SUPER

# Mở ứng dụng thường dùng
bind = $mainMod, RETURN, exec, kitty || gnome-terminal
bind = $mainMod, SPACE, exec, ~/.config/hypr/scripts/OpenApps.sh
bind = $mainMod, E, exec, thunar || nautilus
bind = $mainMod, B, exec, microsoft-edge-stable || microsoft-edge || firefox || google-chrome

# Quản lý cửa sổ
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0

# Bảng điều khiển & Tiện ích mở rộng
bind = $mainMod, ESCAPE, exec, ~/.config/hypr/scripts/Wlogout.sh
bind = $mainMod, S, exec, python3 ~/.config/hypr/scripts/serena_dashboard.py
bind = $mainMod, N, exec, ~/.config/hypr/scripts/toggle_control_center.sh
bind = CTRL SHIFT, ESCAPE, exec, kitty --class btop-serena -T "Task Manager" btop

# Tiện ích hệ thống
bind = $mainMod, L, exec, hyprlock
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = CTRL, SPACE, exec, fcitx5-remote -t || ~/.config/hypr/scripts/toggle_vietnamese.sh
bind = $mainMod, W, exec, python3 ~/.config/hypr/scripts/wallpaper_switcher.py next

# Phím đa phương tiện (Fn Âm lượng & Độ sáng)
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Chuyển đổi giữa các cửa sổ
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Chuyển không gian làm việc (Workspaces 1 -> 5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Đưa cửa sổ sang không gian làm việc (Move window to Workspace)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Chuột kéo thả di chuyển & chỉnh kích thước cửa sổ
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
