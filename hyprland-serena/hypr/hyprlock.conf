# ==============================================================================
# 🌸 HYPRLOCK CONFIG (MINIMALIST ANIME THEME - RED RIBBON EDITION)
# Clean Minimalist UI: Refined borders, deep red-black wine card, zero harsh shadows.
# Official Ribbon Palette: Wine (#180810 / #280E1A), Ribbon Red (#FF2A55), Ivory (#FFF0F5)
# ==============================================================================

general {
    grace = 0
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = false
}

# --- BACKGROUND & BLUR ---
background {
    monitor =
    path = /home/meobanh/custom/ricing/wallpapers/serena_fennekin_wallpaper_hd.jpg
    color = rgb(24, 8, 16)

    # Minimalist smooth backdrop blur
    blur_passes = 2
    blur_size = 6
    noise = 0.012
    contrast = 1.05
    brightness = 0.70
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# --- CLOCK & DATE (TOP) ---
# Time (12h format with AM/PM)
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%I:%M %p")</b>"
    color = rgba(255, 240, 245, 0.98)
    font_size = 54
    font_family = JetBrainsMono Nerd Font, Ubuntu
    position = 0, -35
    halign = center
    valign = top
    shadow_passes = 0
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(232, 194, 208, 0.95)
    font_size = 14
    font_family = JetBrainsMono Nerd Font, Ubuntu
    position = 0, -112
    halign = center
    valign = top
    shadow_passes = 0
}

# --- CENTER CARD (MINIMALIST RED-BLACK CONTAINER) ---
shape {
    monitor =
    size = 340, 390
    color = rgba(40, 14, 26, 0.94)
    rounding = 20
    border_size = 1
    border_color = rgba(255, 42, 85, 0.38)
    rotate = 0
    xray = false
    position = 0, -20
    halign = center
    valign = center
}

# Avatar with Vibrant Ribbon Red Accent Border
image {
    monitor =
    path = $HOME/.config/hypr/serena_lock_avatar.png
    size = 112
    rounding = -1
    border_size = 2
    border_color = rgba(255, 42, 85, 0.80)
    rotate = 0
    reload_time = -1
    position = 0, 92
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = <b>Hi, $USER! ✨</b>
    color = rgba(255, 240, 245, 0.98)
    font_size = 16.5
    font_family = JetBrainsMono Nerd Font, Ubuntu
    position = 0, 4
    halign = center
    valign = center
    shadow_passes = 0
}

# --- PASSWORD INPUT FIELD ---
input-field {
    monitor =
    size = 250, 42
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 42, 85, 0.40)
    inner_color = rgba(24, 8, 16, 0.96)
    font_color = rgb(255, 240, 245)
    fade_on_empty = false
    rounding = 12
    placeholder_text = <i><span foreground="##e8c2d0">🔒 Enter Password...</span></i>
    hide_input = false
    check_color = rgb(255, 42, 85)
    fail_color = rgb(255, 42, 85)
    fail_text = <i><span foreground="##ff2a55">❌ Incorrect password ($ATTEMPTS)</span></i>
    capslock_color = rgb(229, 154, 68)
    position = 0, -82
    halign = center
    valign = center
    shadow_passes = 0
}

# Subtitle Quote
label {
    monitor =
    text = <i>"Never give up until the very end! 🌸"</i>
    color = rgba(232, 194, 208, 0.85)
    font_size = 11
    font_family = JetBrainsMono Nerd Font, Ubuntu
    position = 0, -140
    halign = center
    valign = center
    shadow_passes = 0
}

# --- BOTTOM STATUS INFO ---
label {
    monitor =
    text = cmd[update:10000] echo "<b>$($HOME/.config/hypr/scripts/Battery.sh)</b>  •  ⌨ $LAYOUT"
    color = rgba(166, 133, 149, 0.85)
    font_size = 11
    font_family = JetBrainsMono Nerd Font, Ubuntu
    position = 0, 25
    halign = center
    valign = bottom
    shadow_passes = 0
}
