# ==============================================================================
# 🌸 SERENA & SYLVEON HYPRLOCK CONFIG
# ==============================================================================
# Màn hình khóa phong cách Pokémon Serena & Sylveon
# - Acrylic Frosted Glass mờ ảo diệu
# - Chibi Sylveon Avatar với viền Ribbon Rose & Serena Crimson
# - Typography hiện đại, sạch đẹp, hiển thị giờ & ngày chuẩn xác
# ==============================================================================

general {
    grace = 0
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = false
}

# --- HÌNH NỀN & HIỆU ỨNG FROSTED GLASS ---
background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(24, 24, 37)

    # Hiệu ứng kính mờ (Acrylic Blur)
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 1.05
    brightness = 0.72
    vibrancy = 0.22
    vibrancy_darkness = 0.0
}

# --- ĐỒNG HỒ & THỜI GIAN (TOP) ---
# Giờ (12h format kèm AM/PM)
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%I:%M %p")</b>"
    color = rgba(255, 255, 255, 0.98)
    font_size = 54
    font_family = Ubuntu
    position = 0, -35
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# Ngày tháng năm
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(255, 180, 200, 0.92)
    font_size = 15
    font_family = Ubuntu
    position = 0, -115
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.3)
}

# --- KHỐI THẺ ACRYLIC TRUNG TÂM (CENTER CARD) ---
shape {
    monitor =
    size = 340, 400
    color = rgba(24, 24, 37, 0.78)
    rounding = 24
    border_size = 2
    border_color = rgba(229, 57, 53, 0.75)
    rotate = 0
    xray = false
    position = 0, -20
    halign = center
    valign = center
}

# Avatar Serena xinh xắn với viền tròn Ribbon Rose
image {
    monitor =
    path = $HOME/.config/hypr/serena_lock_avatar.png
    size = 120
    rounding = -1
    border_size = 3
    border_color = rgba(255, 107, 139, 0.9)
    rotate = 0
    reload_time = -1
    position = 0, 92
    halign = center
    valign = center
}

# Lời chào Serena & User
label {
    monitor =
    text = <b>Hi, $USER! ✨</b>
    color = rgba(255, 255, 255, 0.95)
    font_size = 17
    font_family = Ubuntu
    position = 0, 2
    halign = center
    valign = center
}

# Phụ đề chủ đề Serena & Sylveon
label {
    monitor =
    text = 🌸 Serena &amp; Sylveon Edition
    color = rgba(255, 107, 139, 0.9)
    font_size = 11
    font_family = Ubuntu
    position = 0, -32
    halign = center
    valign = center
}

# Ô NHẬP MẬT KHẨU (PASSWORD INPUT)
input-field {
    monitor =
    size = 250, 44
    outline_thickness = 2
    dots_size = 0.25 # Scale of input-field height
    dots_spacing = 0.28 # Spacing between dots
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(229, 57, 53, 0.85)
    inner_color = rgba(18, 18, 28, 0.85)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 14
    placeholder_text = <i><span foreground="##ff8fa3">🔒 Enter Password...</span></i>
    hide_input = false
    check_color = rgb(255, 107, 139)
    fail_color = rgb(229, 57, 53)
    fail_text = <i><span foreground="##ff6b8b">❌ Incorrect password ($ATTEMPTS)</span></i>
    capslock_color = rgb(255, 170, 0)
    position = 0, -88
    halign = center
    valign = center
}

# Câu danh ngôn truyền cảm hứng của Serena
label {
    monitor =
    text = <i>"Never give up until the very end! 🌸"</i>
    color = rgba(255, 180, 200, 0.7)
    font_size = 11
    font_family = Ubuntu
    position = 0, -145
    halign = center
    valign = center
}

# --- THÔNG TIN TRẠNG THÁI PHÍA DƯỚI (BOTTOM STATUS) ---
label {
    monitor =
    text = cmd[update:10000] echo "<b>$($HOME/.config/hypr/scripts/Battery.sh)</b>  •  ⌨ $LAYOUT"
    color = rgba(255, 255, 255, 0.6)
    font_size = 11
    font_family = Ubuntu
    position = 0, 25
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.4)
}
