# ==============================================================================
# 🌸 SERENA & SYLVEON KITTY TERMINAL THEME
# ==============================================================================

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

window_padding_width 12
remember_window_size no
initial_window_width 860
initial_window_height 540
background_opacity 0.90
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell no
linux_display_server auto

# Con trỏ chuột
cursor #FF6B8B
cursor_text_color #181825
cursor_shape beam
cursor_trail 1

# Màu nền & Chữ
background #181825
foreground #F5F5F5
selection_background #E53935
selection_foreground #FFFFFF

# Bảng màu Serena & Sylveon Palette
# Black
color0 #181825
color8 #585B70

# Red (Serena Crimson & Ribbon Rose)
color1 #E53935
color9 #FF6B8B

# Green
color2 #A6E3A1
color10 #94E2D5

# Yellow (Honey Amber)
color3 #FFB74D
color11 #F9E2AF

# Blue (Sylveon Blue)
color4 #61B8FF
color12 #89B4FA

# Magenta (Sylveon Pink)
color5 #F06292
color13 #F5C2E7

# Cyan
color6 #89DCEB
color14 #94E2D5

# White
color7 #BAC2DE
color15 #FFFFFF

