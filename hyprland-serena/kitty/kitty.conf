# ==============================================================================
# 🌸 SERENA & FENNEKIN KITTY TERMINAL THEME
# Flat UI Colors derived from serena_fennekin_wallpaper_hd.jpg
# ==============================================================================

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

window_padding_width 12
remember_window_size no
initial_window_width 860
initial_window_height 540
background_opacity 0.94
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell no
linux_display_server auto

# Con trỏ chuột
cursor #C82A2B
cursor_text_color #161726
cursor_shape beam
cursor_trail 1

# Màu nền & Chữ
background #161726
foreground #FFF1D4
selection_background #C82A2B
selection_foreground #FFFFFF

# Bảng màu Serena & Fennekin ANSI 16 Colors
# Black / Dusky Midnight
color0 #161726
color8 #343654

# Red (Serena Hat & Vest Warm Crimson)
color1 #C82A2B
color9 #DB3B32

# Green (Natural Sage Scenery)
color2 #7FA873
color10 #98BD8D

# Yellow / Amber (Fennekin Fur)
color3 #B7823C
color11 #E59A44

# Blue / Indigo (Evening Dusk Sky)
color4 #5E5BAA
color12 #7772C2

# Magenta / Violet (Shaded Crimson & Sunset Lavender)
color5 #88293F
color13 #A28DD8

# Cyan / Slate (Muted Blue-Gray Sky Transition)
color6 #6A7895
color14 #8B9BB8

# White / Warm Ivory
color7 #B4A5D0
color15 #FFF1D4
