# ==============================================================================
# 🌸 SERENA & FENNEKIN KITTY TERMINAL THEME
# Locked Serena Palette (Warm Obsidian-Wine & Ribbon Red #FF2A55)
# ==============================================================================

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

window_padding_width 12
remember_window_size no
initial_window_width 860
initial_window_height 540
background_opacity 0.94
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell no
linux_display_server auto

# Con trỏ chuột
cursor #FF2A55
cursor_text_color #201011
cursor_shape beam
cursor_trail 1

# Màu nền & Chữ
background #201011
foreground #FFF0F5
selection_background #FF2A55
selection_foreground #FFFFFF

# Bảng màu Serena ANSI 16 Colors
# Black / Warm Obsidian-Wine
color0 #201011
color8 #3A222A

# Red (Serena Ribbon Red & Soft Coral)
color1 #FF2A55
color9 #FF597B

# Green (Sage & Bright Mint)
color2 #7FA873
color10 #98BD8D

# Yellow / Amber (Warm Honey & Soft Gold)
color3 #E59A44
color11 #F5B05E

# Blue / Indigo (Serena Dusk Blue)
color4 #7772C2
color12 #9590E0

# Magenta / Rose (Lavender-Rose & Bright Pink)
color5 #E8C2D0
color13 #FF8DA1

# Cyan / Slate (Muted Mauve)
color6 #A68595
color14 #C4A7B5

# White / Rose-Ivory
color7 #FFF0F5
color15 #FFFFFF
