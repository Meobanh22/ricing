# kitty.conf — Terminal configuration and color tokens.
# NOTE: Generated from tokens.json. Do not edit directly.

# === FONT & WINDOW ===
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

window_padding_width 12
remember_window_size no
initial_window_width 860
initial_window_height 540
background_opacity 0.94
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell no
linux_display_server auto
shell zsh

# === CURSOR ===
cursor #DC1A36
cursor_text_color #201011
cursor_shape beam
cursor_trail 1

# === COLORS ===
background #201011
foreground #FFF0F5
selection_background #DC1A36
selection_foreground #FFFFFF

# === ANSI COLORS ===
# Black
color0 #201011
color8 #3A222A

# Red
color1 #DC1A36
color9 #F02D4C

# Green
color2 #50A6FF
color10 #50A6FF

# Yellow
color3 #F02D4C
color11 #F02D4C

# Blue
color4 #50A6FF
color12 #50A6FF

# Magenta
color5 #E8C2D0
color13 #E8C2D0

# Cyan
color6 #50A6FF
color14 #A68595

# White
color7 #FFF0F5
color15 #FFFFFF
