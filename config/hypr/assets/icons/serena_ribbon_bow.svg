<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <g id="bow-silhouette">
      <!-- Left Wing -->
      <path d="M 42 38 C 30 22, 16 18, 10 24 C 6 29, 6 65, 10 70 C 16 76, 30 72, 42 56 Z"/>
      <!-- Right Wing -->
      <path d="M 58 38 C 70 22, 84 18, 90 24 C 94 29, 94 65, 90 70 C 84 76, 70 72, 58 56 Z"/>
      <!-- Center Knot -->
      <rect x="41" y="32" width="18" height="30" rx="7"/>
    </g>
  </defs>

  <!-- Bold 3D Cel-shaded Bottom Border (matching pokepuff style) -->
  <use href="#bow-silhouette" y="7" fill="#4D0A1C" stroke="#4D0A1C" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Wings (Flat Matte Accent Red) -->
  <path d="M 42 38 C 30 22, 16 18, 10 24 C 6 29, 6 65, 10 70 C 16 76, 30 72, 42 56 Z"
        fill="#DC1A36" stroke="#4D0A1C" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M 58 38 C 70 22, 84 18, 90 24 C 94 29, 94 65, 90 70 C 84 76, 70 72, 58 56 Z"
        fill="#DC1A36" stroke="#4D0A1C" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Center Knot (Flat Matte Accent Hover for subtle clean contrast) -->
  <rect x="41" y="32" width="18" height="30" rx="7"
        fill="#F02D4C" stroke="#4D0A1C" stroke-width="3.5" stroke-linejoin="round" />
</svg>