# hyprlock.conf — Hyprlock screen locker configuration.
source = ~/.config/hypr/palette.conf

general {
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = false
}

# === SEAMLESS ANIMATIONS (TRANSITION HYPRLOCK <-> HYPRLAND) ===
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = linear, 0, 0, 1, 1

    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 4, easeInOutCubic
    animation = inputFieldColors, 1, 3, easeOutQuint
}

# === BACKGROUND & BLUR (SEAMLESS WALLPAPER BLUR) ===
background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = $bg_window
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# === CLOCK & DATE ===
# Time (12h format with AM/PM)
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%I:%M %p")</b>"
    color = $text_primary
    font_size = 54
    font_family = JetBrains Mono Nerd Font, FiraCode Nerd Font, Segoe UI, sans-serif
    position = 0, -35
    halign = center
    valign = top
    shadow_passes = 0
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = $text_secondary
    font_size = 14
    font_family = JetBrains Mono Nerd Font, FiraCode Nerd Font, Segoe UI, sans-serif
    position = 0, -112
    halign = center
    valign = top
    shadow_passes = 0
}

# === CENTER CARD (TACTILE 3D PROFILE WIDGET STYLE) ===
# 1. 3D Shadow Base (Offset down by 6px)
shape {
    monitor =
    size = 400, 440
    color = $border_waybar_3d
    rounding = 18
    border_size = 0
    rotate = 0
    xray = false
    position = 0, -26
    halign = center
    valign = center
}

# 2. Main Tactile Cream Card Body
shape {
    monitor =
    size = 400, 440
    color = $bg_tactile_cream
    rounding = 18
    border_size = 2
    border_color = $border_waybar_3d
    rotate = 0
    xray = false
    position = 0, -20
    halign = center
    valign = center
}

# Avatar
image {
    monitor =
    path = $HOME/.config/hypr/serena_lock_avatar.png
    size = 112
    rounding = -1
    border_size = 2
    border_color = $border_waybar_3d
    rotate = 0
    reload_time = -1
    position = 0, 108
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = <b>Hi, $USER! ✨</b>
    color = $bg_waybar
    font_size = 14
    font_family = JetBrains Mono Nerd Font, FiraCode Nerd Font, Segoe UI, sans-serif
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 0
}

# === PASSWORD INPUT FIELD ===
input-field {
    monitor =
    size = 260, 42
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $text_inverse
    font_color = $bg_waybar
    fade_on_empty = false
    rounding = 10
    placeholder_text = <i><span foreground="##a68595">Enter Password...</span></i>
    hide_input = false
    check_color = $accent
    fail_color = $status_critical
    fail_text = <i><span foreground="##dc1a36">❌ Incorrect password ($ATTEMPTS)</span></i>
    capslock_color = $accent_hover
    position = 0, -52
    halign = center
    valign = center
    shadow_passes = 0
}

# Subtitle Quote
label {
    monitor =
    text = <i>"Never give up until the very end!"</i>
    color = $bg_waybar
    font_size = 10
    font_family = Cantarell, Liberation Sans, JetBrains Mono Nerd Font, sans-serif
    position = 0, -116
    halign = center
    valign = center
    shadow_passes = 0
}

# Solid Minimal Bow Emblem
image {
    monitor =
    path = $HOME/.config/hypr/assets/icons/serena_ribbon_minimal.png
    size = 28
    rounding = 0
    border_size = 0
    reload_time = -1
    position = 0, -162
    halign = center
    valign = center
}

# === BOTTOM STATUS INFO ===
label {
    monitor =
    text = cmd[update:10000] echo "<b>$($HOME/.config/hypr/scripts/system/Battery.sh)</b>  •  ⌨ $LAYOUT"
    color = $text_muted
    font_size = 11
    font_family = JetBrains Mono Nerd Font, FiraCode Nerd Font, Segoe UI, sans-serif
    position = 0, 25
    halign = center
    valign = bottom
    shadow_passes = 0
}
