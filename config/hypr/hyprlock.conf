# hyprlock.conf — Hyprlock screen locker configuration.
source = ~/.config/hypr/palette.conf

general {
    grace = 0
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = false
}

# === BACKGROUND & BLUR ===
background {
    monitor =
    path = $HOME/Pictures/wallpapers/serena_fennekin_wallpaper_hd.jpg
    color = $bg_window
    blur_passes = 2
    blur_size = 6
}

# === CLOCK & DATE ===
# Time (12h format with AM/PM)
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%I:%M %p")</b>"
    color = $text_primary
    font_size = 54
    font_family = JetBrains Mono Nerd Font, FiraCode Nerd Font, Segoe UI, sans-serif
    position = 0, -35
    halign = center
    valign = top
    shadow_passes = 0
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = $text_secondary
    font_size = 14
    font_family = JetBrains Mono Nerd Font, FiraCode Nerd Font, Segoe UI, sans-serif
    position = 0, -112
    halign = center
    valign = top
    shadow_passes = 0
}

# === CENTER CARD ===
shape {
    monitor =
    size = 340, 390
    color = $bg_card
    rounding = 16
    border_size = 1
    border_color = $border_card
    rotate = 0
    xray = false
    position = 0, -20
    halign = center
    valign = center
}

# Avatar
image {
    monitor =
    path = $HOME/.config/hypr/serena_lock_avatar.png
    size = 112
    rounding = -1
    border_size = 1
    border_color = $border_card
    rotate = 0
    reload_time = -1
    position = 0, 92
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = <b>Hi, $USER! ✨</b>
    color = $text_primary
    font_size = 14
    font_family = JetBrains Mono Nerd Font, FiraCode Nerd Font, Segoe UI, sans-serif
    position = 0, 4
    halign = center
    valign = center
    shadow_passes = 0
}

# === PASSWORD INPUT FIELD ===
input-field {
    monitor =
    size = 250, 42
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $bg_card
    font_color = $text_primary
    fade_on_empty = false
    rounding = 8
    placeholder_text = <i><span foreground="##e8c2d0">🔒 Enter Password...</span></i>
    hide_input = false
    check_color = $accent
    fail_color = $status_critical
    fail_text = <i><span foreground="##ff2a55">❌ Incorrect password ($ATTEMPTS)</span></i>
    capslock_color = $accent_hover
    position = 0, -82
    halign = center
    valign = center
    shadow_passes = 0
}

# Subtitle Quote
label {
    monitor =
    text = <i>"Never give up until the very end! ✿"</i>
    color = $text_secondary
    font_size = 11
    font_family = JetBrains Mono Nerd Font, FiraCode Nerd Font, Segoe UI, sans-serif
    position = 0, -140
    halign = center
    valign = center
    shadow_passes = 0
}

# === BOTTOM STATUS INFO ===
label {
    monitor =
    text = cmd[update:10000] echo "<b>$($HOME/.config/hypr/scripts/Battery.sh)</b>  •  ⌨ $LAYOUT"
    color = $text_muted
    font_size = 11
    font_family = JetBrains Mono Nerd Font, FiraCode Nerd Font, Segoe UI, sans-serif
    position = 0, 25
    halign = center
    valign = bottom
    shadow_passes = 0
}
